name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.13"
          python-version: "3.12"
          enable-cache: true
      - name: Install audio and test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libsndfile1 shellcheck nodejs build-essential
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Check setup scripts
        run: shellcheck scripts/*.sh
      - name: Download verified base models
        run: scripts/download_models.sh
      - name: Build distributions
        run: uv build
      - name: Run tests
        run: uv run --locked pytest -ra

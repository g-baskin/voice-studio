# Generated for this repo's stack: Python (uv) app with Node (npm) quality tools.
# Action versions verified against each action's latest GitHub release on 2026-11-01, pinned to commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node with npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install system tools (audio, shell checks)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libsndfile1 shellcheck shfmt

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Node tools
        run: npm ci --ignore-scripts

      - name: Lint, format and type checks
        run: npm run check

      - name: Download verified base models
        run: scripts/download_models.sh

      - name: Build distributions
        run: uv build

      - name: Run tests
        run: uv run --locked pytest -ra
